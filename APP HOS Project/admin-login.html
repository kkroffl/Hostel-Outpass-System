<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Hostel Outpass</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center cursor-pointer" onclick="location.href='index.html'">
                <div class="w-8 h-8 bg-blue-600 text-white flex items-center justify-center font-bold rounded">H</div>
                <span class="ml-2 text-xl font-bold text-gray-900">Hostel Outpass</span>
            </div>
            <div class="space-x-4">
                <a href="index.html" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
                <a href="about.html" class="text-gray-700 hover:text-blue-600 font-medium">About</a>
                <a href="features.html" class="text-gray-700 hover:text-blue-600 font-medium">Features</a>
                <a href="rules.html" class="text-gray-700 hover:text-blue-600 font-medium">Rules</a>
                <a href="contact.html" class="text-gray-700 hover:text-blue-600 font-medium">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero/Login Section -->
    <section class="flex-1 bg-gradient-to-br from-purple-50 via-white to-blue-50 py-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <div class="flex items-center justify-center mb-6">
                    <div class="w-20 h-20 bg-purple-100 rounded-2xl flex items-center justify-center">
                        <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 11c0-2.21-1.79-4-4-4S4 8.79 4 11s1.79 4 4 4 4-1.79 4-4zM12 7v2m0 4v6m4-6h-8" />
                        </svg>
                    </div>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">Admin Portal</h1>
                <p class="text-xl text-gray-600">Login to manage outpass requests and hostel operations</p>
            </div>

            <div class="max-w-md mx-auto p-8 shadow-2xl bg-white rounded-xl">
                <form id="adminLoginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Admin Email</label>
                        <input type="email" id="email" placeholder="admin@college.edu" required
                            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required
                            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" />
                    </div>
                    <button type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 py-6 text-lg text-white font-semibold rounded-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m12 0l-4-4m4 4l-4 4" />
                        </svg>
                        Login as Admin
                    </button>
                    <p class="text-sm text-gray-500 text-center">Demo: admin@college.edu (any password)</p>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-200">
                    <p class="text-xs text-gray-500 text-center">
                        For student login, please use the <a href="login.html"
                            class="text-blue-600 hover:text-blue-700">Student Portal</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-50 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-600">
            &copy; 2025 Hostel Outpass System.
        </div>
    </footer>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Logged in as Admin: ${email}\nRedirecting to admin dashboard...`);
        });
    </script>

</body>

</html>
